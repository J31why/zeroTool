说明：
FontName：字体名称，必须系统安装后的字体。
FontSize：字体大小，一般为82。
BaselineOffset：字符基准线，调整字符的垂直位置，负值表示上移，正值表示下移。
UnicodeRange：指定字体包含的Unicode字符范围，多个范围用逗号分隔。
FontWeight：字体粗细，可选值有Thin、ExtraLight、Light、Normal、Medium、SemiBold、Bold、ExtraBold、Black、ExtraBlack。
--------------------------------------------------
FontName = 霞鹜臻楷 GB
FontSize = 82
BaselineOffset = -8
UnicodeRange= 0x20-0x32ff, 0x4e00-0x9fff, 0xff00-0xfff0
FontWeight = Normal